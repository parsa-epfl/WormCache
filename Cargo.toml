[package]
name = "worm_cache"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.17.0"
lru = "0.9.0"
bitvec = "1.0.1"
chrono = "0.4.23"
rand = { version = "0.8.5", feature ="alloc" }

[lib]
crate-type=["rlib", "cdylib"]

[profile.release]
debug = true
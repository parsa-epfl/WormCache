workspace = { members = ["plugin_helper"] }
[package]
name = "worm_cache"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = { version = "0.8.5" }
serde_json = "1.0.111"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.18.0"
bitvec = "1.0.1"
plugin_helper = { path = "./plugin_helper" }
dashmap = "5.5.3"
gcd = "2.3.0"
spin = "0.9.8"
static_assertions = "1.1.0"
libc = "0.2.154"
rustc-hash = "2.0.0"
strum_macros = "0.26.2"
strum = "0.26.2"
perf-event = "0.4.8"

[lib]
crate-type=["rlib", "cdylib"]

[profile.release]
debug = true

